name: Flatpak

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/flatpak.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SudoClaude.flatpak
          manifest-path: app/io.github.splitshotz.SudoClaude.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SudoClaude ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: SudoClaude.flatpak
