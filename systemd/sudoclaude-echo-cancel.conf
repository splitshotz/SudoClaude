# Echo cancellation for the voice assistant. The speakers' output is used as a
# reference and subtracted from the mic, so Claude can hear you over music and
# over its own voice. monitor.mode watches the real output, so nothing has to be
# rerouted. Delete this file and restart PipeWire to undo it.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true
            node.latency  = 1024/48000
            capture.props = {
                node.passive  = true
            }
            source.props = {
                node.name        = "sudoclaude_mic"
                node.description = "SudoClaude microphone (echo cancelled)"
            }
            playback.props = { node.passive = true }
            aec.args = {
                webrtc.gain_control      = false
                webrtc.noise_suppression = false
                webrtc.echo_canceller    = true
                webrtc.extended_filter   = true
            }
        }
    }
]
